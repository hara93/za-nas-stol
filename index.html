<!doctype html>
<html lang="hr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Obiteljski jelovnik: tjedni plan, recepti, kupovina i kuhanje korak po korak.">
<meta name="theme-color" content="#F8F7F3">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("zns:theme")) === "dark" ? "dark" : "light"; } catch(e) {}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Za naš stol">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Za naš stol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: mobitel prvo – jedan stupac (do 760 px) sa staklenim zaglavljem i plutajućom trakom kartica pri dnu;
   od 1024 px lijeva traka navigacije i širi sadržaj. Boju nose ilustracije jela; sučelje je mirno:
   jadranska plava za radnje, maslinasta za "pojedeno/kupljeno", limun za "danas/sljedeće". */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EBF0EC; --surface-3:#DFE6E1; --ink:#14232A; --muted:#5A696E; --line:#DCE3DE;
  --sea:#1C5D78; --sea-ink:#FFFFFF; --sea-soft:#DDEDF3; --sea-deep:#123F52;
  --olive:#56772F; --olive-ink:#FFFFFF; --olive-soft:#E6EEDA;
  --citrus:#E9A920; --citrus-ink:#2A1E00; --citrus-soft:#FCF0CF;
  --tomato:#C9432B; --tomato-soft:#FAE3DC; --warn:#A86A0B;
  --pT:#1C5D78; --pS:#B24E72; --pK:#C98A0E;
  --scrim:rgba(12,22,27,.42); --glass:rgba(243,245,242,.78); --glass-strong:rgba(255,255,255,.86);
  --shadow-1:0 1px 2px rgba(20,35,42,.06),0 2px 8px rgba(20,35,42,.05);
  --shadow-2:0 2px 6px rgba(20,35,42,.07),0 14px 34px rgba(20,35,42,.11);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-lg:24px; --r:18px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1); --rail:240px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E161A; --surface:#162127; --surface-2:#1D2A31; --surface-3:#26353D; --ink:#E6EEF0; --muted:#97A8AE; --line:#26353C;
  --sea:#7CC4DE; --sea-ink:#06202B; --sea-soft:#163747; --sea-deep:#A9DCEE;
  --olive:#A6C97B; --olive-ink:#132006; --olive-soft:#1F3119;
  --citrus:#F4C452; --citrus-ink:#2A1E00; --citrus-soft:#3A2F12;
  --tomato:#F2896F; --tomato-soft:#3D2420; --warn:#E9B14E;
  --pT:#7CC4DE; --pS:#EE93B4; --pK:#F4C452;
  --scrim:rgba(0,0,0,.55); --glass:rgba(14,22,26,.78); --glass-strong:rgba(22,33,39,.9);
  --shadow-1:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E161A; --surface:#162127; --surface-2:#1D2A31; --surface-3:#26353D; --ink:#E6EEF0; --muted:#97A8AE; --line:#26353C;
  --sea:#7CC4DE; --sea-ink:#06202B; --sea-soft:#163747; --sea-deep:#A9DCEE;
  --olive:#A6C97B; --olive-ink:#132006; --olive-soft:#1F3119;
  --citrus:#F4C452; --citrus-ink:#2A1E00; --citrus-soft:#3A2F12;
  --tomato:#F2896F; --tomato-soft:#3D2420; --warn:#E9B14E;
  --pT:#7CC4DE; --pS:#EE93B4; --pK:#F4C452;
  --scrim:rgba(0,0,0,.55); --glass:rgba(14,22,26,.78); --glass-strong:rgba(22,33,39,.9);
  --shadow-1:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto;overscroll-behavior-y:none}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.75rem,6vw,2.35rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.45rem}
h3{font-size:1.12rem}
p{margin:0}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--sea);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important;border:0!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- zaglavlje ---------- */
/* Zaglavlje je fiksno i samo prekriva područje statusne trake (iPhone s početnog zaslona): sticky ondje nije pouzdan. */
.top{position:fixed;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px);z-index:9;background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:var(--font-display);font-size:1.12rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.brand small{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--muted);font-weight:600;white-space:nowrap}
.brand small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.6}
.brand small.live::before{background:var(--olive);opacity:1;box-shadow:0 0 0 3px var(--olive-soft)}
.top-r{display:flex;align-items:center;gap:8px}
.persons{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.persons button{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.persons button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-weight:800;font-size:.78rem;color:#fff;background:var(--pT);flex:none;font-family:var(--font-display)}
.av.S{background:var(--pS)}.av.K{background:var(--pK)}
:root:not([data-theme="light"]) .av{color:var(--surface)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .av{color:#fff} }
:root[data-theme="light"] .av{color:#fff}
@media (max-width:420px){.persons button span{display:none}.persons button{padding:4px}}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--ink);flex:none}
.icon-btn.ghost{background:transparent}
.icon-btn[aria-current="page"]{background:var(--sea-soft);color:var(--sea)}

/* ---------- navigacija: plutajuća traka (mobitel) / lijeva traka (desktop) ---------- */
nav.tabs{position:fixed;z-index:9;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{position:relative;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow-2)}
nav.tabs button{position:relative;z-index:1;display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.01em;border-radius:20px}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--sea)}
nav.tabs .ind{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:20px;background:var(--sea-soft);transform:translateX(calc(var(--i,0) * 100%));transition:transform .38s var(--ease)}
nav.tabs .ind.off{opacity:0}
nav.tabs .rail-brand,nav.tabs .rail-foot{display:none}
nav.tabs .badge{position:absolute;top:3px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--citrus);color:var(--citrus-ink);font-size:.62rem;display:grid;place-items:center;font-weight:800}
@media (min-width:1024px){
  nav.tabs{left:0;right:auto;top:0;bottom:0;width:var(--rail);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);border-right:1px solid var(--line);background:var(--surface)}
  nav.tabs .in{height:100%;max-width:none;display:flex;flex-direction:column;gap:4px;background:none;border:0;border-radius:0;box-shadow:none;padding:20px 14px;-webkit-backdrop-filter:none;backdrop-filter:none}
  nav.tabs .rail-brand{display:flex;padding:4px 10px 22px}
  nav.tabs button{display:flex;align-items:center;gap:12px;padding:11px 14px;font-size:.98rem;font-weight:600;border-radius:14px;justify-items:start}
  nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
  nav.tabs button[aria-current="page"]{background:var(--sea-soft);color:var(--sea)}
  nav.tabs .ind{display:none}
  nav.tabs .badge{position:static;margin-left:auto}
  nav.tabs .rail-foot{display:block;margin-top:auto;padding:12px 10px 0;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
  .top .brand{visibility:hidden}
  .top{left:var(--rail)}
  main,#timers-root{margin-left:var(--rail)}
  .top-in{max-width:1100px}
}

/* ---------- glavni sadržaj ---------- */
main{max-width:760px;margin:0 auto;padding-block:76px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
@media (min-width:1024px){main{max-width:calc(1100px + var(--rail));padding-left:calc(var(--rail) + 40px);padding-right:40px;margin-left:0;padding-bottom:64px}}
main > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.flat{background:var(--surface-2);border-color:transparent}
.stack{display:grid;gap:12px}
.stack > *,.card > *{min-width:0}
.stack.tight{gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sect-h h2,.sect-h h3{min-width:0}
.pagehead{display:grid;gap:4px;padding-top:6px}
.pagehead .row{justify-content:space-between}

/* gumbi */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:.92rem;background:var(--surface-2);color:var(--ink);border:1px solid transparent;min-height:42px;white-space:nowrap}
.btn.primary{background:var(--sea);color:var(--sea-ink)}
.btn.olive{background:var(--olive);color:var(--olive-ink)}
.btn.outline{background:transparent;border-color:var(--line)}
.btn.soft{background:var(--sea-soft);color:var(--sea)}
.btn.lg{min-height:54px;padding:14px 22px;font-size:1.02rem;border-radius:18px}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.84rem}
.btn.danger{color:var(--tomato)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px;scroll-padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:.84rem;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line);white-space:nowrap;flex:none}
.chip.on{background:var(--sea);color:var(--sea-ink);border-color:var(--sea)}
.chip.tag{background:var(--surface-2);border-color:transparent;color:var(--muted);padding:4px 10px;font-size:.78rem}
.chip .k{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.chip.on .k{color:inherit;opacity:.8}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.01em;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc,var(--muted))}
.pill.riba{--pc:#3E86B0}.pill.perad{--pc:#D9A13A}.pill.crveno{--pc:#B8452F}.pill.svinjetina{--pc:#D97C8E}.pill.jaja{--pc:#E9C13C}.pill.mlijecno{--pc:#8FA4C9}.pill.mahunarke{--pc:#7B9A47}
.pill.glass{background:var(--glass-strong);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 15px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap;flex:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg.full{display:flex}.seg.full button{flex:1}
.seg .n{font-weight:600;opacity:.6;margin-left:3px;font-variant-numeric:tabular-nums}
@media (max-width:440px){.seg .n{display:none}.seg button{padding:8px 12px}}

/* oznaka "pojedeno / kupljeno" */
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;color:transparent;background:var(--surface);flex:none}
.check.on{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.check svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check.sm{width:26px;height:26px}.check.sm svg{width:14px;height:14px}

/* trake i prsten */
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sea);border-radius:999px}
.bar i.good{background:var(--olive)}
.bar i.over{background:var(--citrus)}
.ring{display:block}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--sea);stroke-linecap:round}
.ring .val.good{stroke:var(--olive)}.ring .val.over{stroke:var(--citrus)}

/* ---------- Danas ---------- */
.hello{display:grid;gap:2px;padding-top:6px}
.hello h1 span{color:var(--sea)}
.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:center}
.week .icon-btn{width:30px;height:30px;background:transparent;color:var(--muted)}
.wday{display:grid;justify-items:center;gap:3px;padding:8px 0 7px;border-radius:16px;min-width:0}
.wday small{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wday b{font-family:var(--font-display);font-size:1.1rem;line-height:1;font-weight:700}
.wday .pips{display:flex;gap:3px;height:6px}
.wday .pips i{width:6px;height:6px;border-radius:50%;background:var(--surface-3)}
.wday .pips i.p{background:var(--muted);opacity:.45}
.wday .pips i.e{background:var(--olive);opacity:1}
.wday.today b{color:var(--sea)}
.wday[aria-current="date"]{background:var(--sea);color:var(--sea-ink)}
.wday[aria-current="date"] small,.wday[aria-current="date"] b{color:var(--sea-ink)}
.wday[aria-current="date"] .pips i{background:color-mix(in srgb,var(--sea-ink) 30%,transparent)}
.wday[aria-current="date"] .pips i.p{background:var(--sea-ink);opacity:.6}
.wday[aria-current="date"] .pips i.e{background:var(--citrus);opacity:1}
.daynote{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}

.summary{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.summary .ringbox{position:relative;width:136px;height:136px}
.summary .ringbox .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:0}
.summary .ringbox .c b{font-family:var(--font-display);font-size:1.6rem;line-height:1;font-weight:800;letter-spacing:-.02em}
.summary .ringbox .c small{font-size:.74rem;color:var(--muted);font-weight:600}
.macros{display:grid;gap:12px;min-width:0}
.macro .l{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;margin-bottom:5px}
.macro .l span{font-weight:700}
.macro .l em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:380px){.summary{grid-template-columns:1fr;justify-items:center}.macros{width:100%}}

.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative}
.flow button{display:grid;justify-items:center;text-align:center;gap:6px;padding:4px 4px;position:relative;min-width:0}
.flow button::before{content:"";position:absolute;top:19px;left:calc(-50% + 22px);right:calc(50% + 22px);height:2px;background:var(--surface-3);border-radius:2px}
.flow button:first-child::before{display:none}
.flow button.done::before,.flow button.cur::before{background:var(--olive)}
.flow .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;background:var(--surface-2);color:var(--muted);border:2px solid transparent}
.flow .done .dot{background:var(--olive);color:var(--olive-ink)}
.flow .cur .dot{background:var(--surface);border-color:var(--sea);color:var(--sea);box-shadow:0 0 0 5px var(--sea-soft)}
.flow .dot svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow b{font-size:.86rem;line-height:1.2}
.flow small{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}

.timeline{display:grid;gap:12px}
.mcard{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px 10px 10px;position:relative;transition:border-color .25s,box-shadow .25s}
.mcard .thumb{width:96px;height:96px;border-radius:16px;overflow:hidden;position:relative;background:var(--surface-2);display:block}
.mcard .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .35s,transform .35s var(--ease)}
.mcard .t{min-width:0;display:grid;gap:3px}
.mcard .t .title{font-weight:700;font-size:1rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}

.tile2 .v{font-family:var(--font-display);font-size:1.7rem;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.tile2 .v small{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:0}
.tile2 .d{font-size:.8rem;font-weight:700}
.up{color:var(--olive)}.down{color:var(--warn)}
.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--font-body);font-size:12px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:url(#chart-grad)}
.chart .gs0{stop-color:var(--sea);stop-opacity:.22}.chart .gs1{stop-color:var(--sea);stop-opacity:0}
.chart .ln{fill:none;stroke:var(--sea);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .avg{fill:none;stroke:var(--citrus);stroke-width:2.5;stroke-dasharray:5 5;stroke-linecap:round}
.chart .pt{fill:var(--sea);stroke:var(--surface);stroke-width:2}
.chart .pt.last{fill:var(--citrus)}
.chart .tip{fill:var(--ink)}
.chart .tipbox{fill:var(--surface);stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--sea);vertical-align:middle;margin-right:6px}
.legend i.avg{border-top:2.5px dashed var(--citrus)}
.verdict{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.78rem;font-weight:800;justify-self:start}
.verdict.ok{background:var(--olive-soft);color:var(--olive)}
.verdict.act{background:var(--citrus-soft);color:var(--warn)}
.verdict.wait{background:var(--surface-2);color:var(--muted)}
.entries ul{margin:0;padding:0;list-style:none}
.entries li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}

/* ---------- postavke ---------- */
.person-h{display:flex;align-items:center;gap:12px}
.person-h .av{width:40px;height:40px;font-size:1.05rem}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:.82rem;cursor:pointer;background:var(--surface)}
.daypick label.on{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.info{display:grid;gap:10px;font-size:.9rem;color:var(--muted)}
.info b{color:var(--ink)}

/* ---------- ploča (bottom sheet) ---------- */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start;box-shadow:var(--shadow-2)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--surface-3);justify-self:center;margin-bottom:2px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .sh h3{font-size:1.25rem}
@media (min-width:720px){.sheet-bg{align-items:center}.sheet{border-radius:28px;max-height:80vh}.sheet .grab{display:none}}
.list{display:grid;gap:4px}
.list .item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:6px;border-radius:16px}
.list .item .th{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-family:var(--font-display)}
.list .item .th img{width:100%;height:100%;object-fit:cover;display:block}
.list .item b{font-weight:700;line-height:1.25}
.list .item.sel{background:var(--sea-soft)}
@media (hover:hover){.list .item:hover{background:var(--surface-2)}.list .item.sel:hover{background:var(--sea-soft)}}
.list .item .sub{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.dialog-text{color:var(--muted)}

/* ---------- način kuhanja ---------- */
.cook{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:820px;width:100%;margin:0 auto}
.cook-top .ttl{min-width:0;text-align:center}
.cook-top .ttl b{display:block;font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook-top .ttl small{color:var(--muted);font-size:.8rem;font-weight:600}
.cook-prog{display:flex;gap:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:820px;width:100%;margin:0 auto}
.cook-prog i{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;position:relative}
.cook-prog i::after{content:"";position:absolute;inset:0;background:var(--sea);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.cook-prog i.on::after{transform:scaleX(1)}
.cook-body{overflow:auto;overscroll-behavior:contain;padding-block:24px 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.cook-step{max-width:720px;margin:0 auto;display:grid;gap:18px;align-content:start}
.cook-step .no{font-family:var(--font-display);font-weight:800;font-size:4.5rem;line-height:.9;color:var(--sea);letter-spacing:-.04em}
.cook-step .txt{font-size:clamp(1.3rem,4.6vw,1.85rem);line-height:1.38;font-weight:500;letter-spacing:-.01em;text-wrap:pretty}
.cook-step .pic{width:100%;max-width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden}
.cook-step .pic img{width:100%;height:100%;object-fit:cover;display:block}
.cook-step .tchip{font-size:1rem;padding:9px 16px 9px 12px}
.cook-step .tchip svg{width:20px;height:20px}
.cook-step .ings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 12px}
.cook-foot{display:grid;grid-template-columns:auto 1fr;gap:10px;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:820px;width:100%;margin:0 auto}
.cook-foot .btn{min-height:58px;border-radius:20px;font-size:1.05rem}
.cook-done{text-align:center;justify-items:center}
.cook-done .pic{max-width:420px}
.cook-done h2{font-size:2rem}

/* ---------- mjerači vremena ---------- */
#timers-root{position:fixed;z-index:31;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:end;pointer-events:none}
body.cooking #timers-root{bottom:calc(96px + env(safe-area-inset-bottom,0px));margin-left:0}
@media (min-width:1024px){#timers-root{bottom:24px}}
.timer{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px 6px 6px;box-shadow:var(--shadow-2);font-weight:700}
.timer .tr{width:34px;height:34px;flex:none}
.timer .tr .t0{stroke:color-mix(in srgb,var(--bg) 25%,transparent)}
.timer .tr .t1{stroke:var(--citrus);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer .tm{font-variant-numeric:tabular-nums;font-size:1.02rem;min-width:46px}
.timer .lb{font-size:.74rem;opacity:.7;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.timer button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.timer.done{background:var(--citrus);color:var(--citrus-ink)}
.timer.done button{background:rgba(0,0,0,.12);color:var(--citrus-ink)}

#sheet-ghost{pointer-events:none}
body.sheet-open,body.cooking{overflow:hidden}
#meals{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
[id^="sec-"]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px)}

/* ---------- obavijest ---------- */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.92rem;font-weight:600;z-index:40;box-shadow:var(--shadow-2);max-width:min(92vw,520px);text-align:center;display:flex;align-items:center;gap:8px}
.toast svg{width:18px;height:18px;stroke:var(--olive);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (min-width:1024px){.toast{bottom:28px;margin-left:calc(var(--rail) / 2)}}
body.cooking .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 76px);margin-left:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sea-soft);border-radius:var(--r);padding:14px 16px}

/* ---------- pokret ---------- */
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.check,.seg button,.slot,.wday,.icon-btn,.glassbtn,.flow .dot,.toggle,.ing,.srow,.persons button{transition:background-color .2s,color .2s,border-color .2s,transform .15s var(--ease),box-shadow .2s}
  .btn:active,.chip:active,.icon-btn:active,.wday:active,.slot:active,.glassbtn:active,.rcard:active,.check:active,.toggle:active,.srow:active{transform:scale(.96)}
  .bar i{transition:width .6s var(--ease)}
  .ring .val{transition:stroke-dashoffset .8s var(--ease),stroke .3s}
  .check.on svg,.toggle[aria-pressed="true"] i svg{animation:pop .38s var(--ease)}
  .chip.snack.on img{animation:pop .38s var(--ease)}
  .view-in > *{animation:rise .42s var(--ease) both}
  .view-in > *:nth-child(2){animation-delay:.03s}.view-in > *:nth-child(3){animation-delay:.06s}.view-in > *:nth-child(4){animation-delay:.09s}.view-in > *:nth-child(5){animation-delay:.12s}.view-in > *:nth-child(n+6){animation-delay:.15s}
  .fresh .daycard{animation:rise .5s var(--ease) both;animation-delay:calc(var(--d,0) * 45ms)}
  .sheet-bg{animation:fade .25s ease both}
  .sheet-bg .sheet{animation:up .38s var(--ease) both}
  #sheet-ghost .sheet-bg{animation:fade .24s ease reverse both}
  #sheet-ghost .sheet{animation:down .26s ease-in both}
  .cook{animation:fade .25s ease both}
  .cook-step.fwd{animation:slideL .4s var(--ease) both}
  .cook-step.back{animation:slideR .4s var(--ease) both}
  .toast{animation:toast .35s var(--ease) both}
  .timer{animation:pop .35s var(--ease) both}
  .timer.done{animation:pulse 1.2s ease-in-out infinite}
  .mcard.next{animation:glow 2.8s ease-in-out infinite}
}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{from{transform:none}to{transform:translateY(100%)}}
@keyframes slideL{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--citrus-soft)}50%{box-shadow:0 0 0 6px var(--citrus-soft)}}
@media (prefers-reduced-motion:no-preference) and (min-width:720px){.sheet-bg .sheet{animation:fade .25s ease both}#sheet-ghost .sheet{animation:fade .2s ease reverse both}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
::view-transition-group(dish){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

  /* ---------- scena ---------- */
  function make(id, meal, build) {

    const c = {
      R,

  const hello = `<section class="hello"><div><span class="eyebrow">${isToday ? greet + ' · ' : ''}${fmtDateLong(date)}</span><h1>${isToday ? 'Danas za naš stol.' : 'Na stolu tog dana.'}</h1><p class="muted">Dobri obroci. Više vremena zajedno.</p></div><div class="family"><div class="family-avatars">${PEOPLE.map(av).join('')}</div><span>${family}</span></div></section>`;
  const strip = DAYS.map((dn, i) => {
    const ds = isoDate(addDays(ws, i)); const dpi = dayPlan(ds); const li = getLog(ds);
    const pips = SLOTS.map(([k]) => `<i class="${dpi[k] ? (ate(li, k) ? 'e' : 'p') : ''}"></i>`).join('');
    return `<button class="wday ${ds === td ? 'today' : ''}" data-action="set-date" data-d="${ds}"${ds === date ? ' aria-current="date"' : ''} aria-label="${DAYS_LONG[i]}, ${fmtDate(ds)}"><small>${dn}</small><b>${parseDate(ds).getDate()}</b><span class="pips">${pips}</span></button>`;
  }).join('');
  const trainers = ADULTS.filter(p => s.trainingDays[p].includes(dayIdx(d0)));
  const notes = [...trainers.map(p => `<span class="chip tag">trening · ${esc(pname(p))}</span>`), dp.montaza ? `<span class="chip tag">montaža · hladni ručak</span>` : '', !isToday ? `<button class="btn sm soft" data-action="date-today">${ic('undo')}Natrag na danas</button>` : ''].filter(Boolean).join('');
  const week = `<section class="calendar-strip"><div class="week"><button class="icon-btn" data-action="date" data-d="-7" aria-label="Tjedan ranije">${ic('left')}</button>${strip}<button class="icon-btn" data-action="date" data-d="7" aria-label="Tjedan kasnije">${ic('right')}</button></div>${notes ? `<div class="daynote">${notes}</div>` : ''}</section>`;

  // tri koraka tjedna: plan → kupovina → kuhanje
  const filled = weekFilled(wsIso), shop = shopProgress(wsIso);
  const st = [filled === 21, shop.n > 0 && shop.done === shop.n, planned > 0 && eatenN === planned];
  const cur = st.indexOf(false);
  const stepBtn = (i, title, sub, action) => `<button class="${st[i] ? 'done' : (i === cur ? 'cur' : '')}" ${action}><span class="dot">${st[i] ? ic('check') : i + 1}</span><b>${title}</b><small>${sub}</small></button>`;
  const flow = `<section class="card stack week-flow"><div class="sect-h"><h3>Tjedan pod kontrolom</h3><span class="small muted num">${weekLabel(wsIso)}</span></div>
    <div class="flow">${stepBtn(0, 'Plan tjedna', filled ? `${filled}/21 obroka` : 'još nije složen', `data-action="goto-plan" data-ws="${wsIso}"`)}${stepBtn(1, 'Kupovina', shop.n ? `${shop.done}/${shop.n} kupljeno` : 'nakon plana', `data-action="goto-shop" data-ws="${wsIso}"`)}${stepBtn(2, 'Kuhanje', planned ? `${eatenN}/${planned} ${isToday ? 'danas' : 'tog dana'}` : 'nakon plana', 'data-action="jump" data-t="meals"')}</div>
    ${filled === 0 ? `<div class="banner"><span class="small">Složit ću svih 21 obrok prema vašim pravilima: riba ${fmt(s.fishPerWeek)}× tjedno, bez ponavljanja, izmjena slatkih i slanih doručaka.</span><button class="btn primary" data-action="suggest-week-here">${ic('spark')}Predloži tjedan</button></div>` : ''}</section>`;

  let nextSlot = null;
  if (isToday) { const pending = SLOTS.filter(([k]) => dp[k] && RB[dp[k]] && !ate(log, k)).map(([k]) => k); const current = hr < 10 ? 'b' : hr < 17 ? 'l' : 'v'; nextSlot = pending.find(k => SLOTS.findIndex(([s]) => s === k) >= SLOTS.findIndex(([s]) => s === current)) || pending[0]; }
  const meals = SLOTS.map(([slot, meal, hour]) => {
    const r = RB[dp[slot]]; const eaten = ate(log, slot);
    if (!r) return `<article class="mcard empty" data-key="m-${slot}"><div class="thumb">${ic('plus')}</div><div class="t"><span class="eyebrow">${MEALS[meal]} · ${hour}</span><span class="muted">Nije planirano</span><div class="acts"><button class="btn sm primary" data-action="suggest-slot" data-slot="${slot}">${ic('shuffle')}Predloži</button><button class="btn sm outline" data-action="pick-slot" data-ws="${wsIso}" data-di="${dayIdx(d0)}" data-slot="${slot}">Odaberi</button></div></div></article>`;
    const next = slot === nextSlot;
    return `<article class="mcard ${eaten ? 'done' : ''} ${next ? 'next' : ''}" data-key="m-${slot}">
      <div class="meal-photo"><button class="thumb" data-action="open-recipe" data-id="${r.id}" aria-label="Otvori recept: ${esc(r.title)}">${pic(r.id, '', ' fetchpriority="high"')}<span class="ok">${ic('check', '')}</span></button><span class="meal-label">${MEALS[meal]}</span>${next ? '<span class="flag">Sada na redu</span>' : ''}${favoriteButton(r)}</div>
      <div class="t"><div class="meal-time">${ic('clock')} ${r.time} min <span>· ${hour}</span></div><button class="title" data-action="open-recipe" data-id="${r.id}">${esc(r.title)}</button>
        <div class="meta">${splitLine(r)}</div><div class="acts"><button class="btn ${next ? 'primary' : 'soft'}" data-action="cook" data-id="${r.id}">${ic('play')}Kuhaj</button><button class="btn outline swap-meal" data-action="pick-slot" data-ws="${wsIso}" data-di="${dayIdx(d0)}" data-slot="${slot}" aria-label="Zamijeni ${slot === 'v' ? 'večeru' : lc(MEALS[meal])}">${ic('shuffle')}Zamijeni</button></div></div>

  }).join('');

  // dnevni zbroj po osobi (bez odabira osobe)
  const rows = PEOPLE.map(p => {
    const n = dayNut(date, p, state.onlyEaten); const tg = s.targets[p];
    if (!tg) return `<div class="prow" data-key="pr-${p}"><div class="ph">${av(p)}<b>${esc(pname(p))}</b><span class="num">${fmt(n.kcal || 0)} kcal · ${fmt(n.p || 0)} g proteina</span></div><div class="pm">${pct(p)} % zajedničkog jela</div></div>`;
    const kp = Math.round(100 * (n.kcal || 0) / tg.kcal), cls = (n.kcal || 0) > tg.kcal * 1.08 ? 'over' : (kp >= 90 ? 'good' : '');
    return `<div class="prow" data-key="pr-${p}"><div class="ph">${av(p)}<b>${esc(pname(p))}</b><span class="num">${fmt(n.kcal || 0)} / ${fmt(tg.kcal)} kcal</span></div>${barHtml(kp, cls)}<div class="pm num">Proteini ${fmt(n.p || 0)} / ${fmt(tg.p)} g · UH ${fmt(n.c || 0)} g · masti ${fmt(n.f || 0)} g</div></div>`;
  }).join('');
  const mp = ADULTS.includes(state.microP) ? state.microP : 'T';
  const summary = `<section class="card stack"><div class="sect-h"><h3>Dnevni zbroj</h3><div class="seg" role="group" aria-label="Što zbrajam"><button data-action="only-eaten" data-v="0" aria-pressed="${!state.onlyEaten}">Plan</button><button data-action="only-eaten" data-v="1" aria-pressed="${state.onlyEaten}">Pojedeno</button></div></div>
    <div class="prows">${rows}</div>
    ${planned < 3 && !state.onlyEaten ? `<p class="small muted">Zbroj uključuje ${planned} planirana obroka i označene međuobroke. Dodaj preostale obroke u planu ili dodirni „Predloži”.</p>` : ''}
    <details class="more" id="micro-today"><summary>Mikronutrijenti prema EFSA referencama ${ic('down', '')}</summary><div class="stack"><div class="seg" role="group" aria-label="Osoba">${ADULTS.map(p => `<button data-action="micro-p" data-p="${p}" aria-pressed="${mp === p}">${esc(pname(p))}</button>`).join('')}</div>${microHtml(dayNut(date, mp, state.onlyEaten), mp)}</div></details></section>`;

  // međuobroci: svaka odrasla osoba označava svoje
  const snackBlocks = ADULTS.map(p => {
    const snacks = (log[p] && log[p].snacks) || []; const tg = s.targets[p];
    const plannedNut = dayNut(date, p, false); const remaining = tg.kcal - (plannedNut.kcal || 0);
    let hint = '';
    if (planned === 3 && remaining > 120) {
      const order = (s.defaultSnacks[p] || []).concat(SNACKS.map(x => x.id).filter(id => !(s.defaultSnacks[p] || []).includes(id)).sort((a, b) => SB[b].nut[p].kcal - SB[a].nut[p].kcal));
      let left = remaining + 60; const picks = [];
      for (const id of order) { if (snacks.includes(id)) continue; const k = SB[id].nut[p].kcal; if (k <= left) { picks.push(id); left -= k; } }
      hint = `<div class="hint">${ic('bulb')}<div><b>Do cilja još ${fmt(remaining)} kcal.</b>${picks.length ? `<div class="chips">${picks.map(id => `<button class="chip" data-action="toggle-snack" data-p="${p}" data-id="${id}">${ic('plus')}${esc(SB[id].title)} <span class="k">${fmt(SB[id].nut[p].kcal)}</span></button>`).join('')}</div>` : ' Ostatak je u granici tolerancije.'}</div></div>`;
    } else if (planned === 3 && remaining < -150) hint = `<div class="hint">${ic('bulb')}<div><b>${fmt(-remaining)} kcal iznad cilja.</b> ${snacks.length ? 'Izostavi jedan međuobrok.' : 'Smanji svoj postotak ili prilog uz večeru.'}</div></div>`;
    const chips = SNACKS.map(sn => { const on = snacks.includes(sn.id); return `<button class="chip snack ${on ? 'on' : ''}" data-action="toggle-snack" data-p="${p}" data-id="${sn.id}" data-key="${p}-${sn.id}" aria-pressed="${on}">${pic(sn.id)}<b>${esc(sn.title)}</b><span class="k">${on ? '✓ ' : ''}${fmt(sn.nut[p].kcal)} kcal</span></button>`; }).join('');
    return `<div class="stack tight" data-key="sn-${p}"><div class="person-h sm">${av(p)}<b>${esc(pname(p))}</b></div>${hint}<div class="snackrow chips">${chips}</div></div>`;
  }).join('');
  const snacksCard = `<details class="card disclosure" id="today-snacks"><summary><span>${ic('plus')} Međuobroci</span><span class="small muted">Dodaj pojedeno ${ic('down')}</span></summary><div class="stack disclosure-body">${snackBlocks}</div></details>`;

  // dnevnik: obje odrasle osobe u jednom obrascu
  const quick = `<form class="form" data-action="quick-log" id="quick-log">${ADULTS.map(p => {
    const lp = log[p] || {}; const lastW = series(p, 'weight').filter(q => q.date < date).pop();
    return `<div class="full lrow"><div class="person-h sm">${av(p)}<b>${esc(pname(p))}</b></div>
      <label>Težina (kg)<input type="number" step="0.1" min="30" max="200" inputmode="decimal" id="q-weight-${p}" name="weight-${p}" value="${lp.weight ?? ''}" placeholder="${lastW ? 'zadnje ' + fmt(lastW.v, 1) : 'npr. 77,2'}"></label>
      <label>Struk (cm)<input type="number" step="0.5" min="40" max="200" inputmode="decimal" id="q-waist-${p}" name="waist-${p}" value="${lp.waist ?? ''}" placeholder="npr. 84"></label>
      <button type="button" class="toggle" data-action="toggle-training" data-p="${p}" aria-pressed="${!!lp.training}" id="q-training-${p}"><i>${ic('check', '')}</i>Trening</button></div>`;
  }).join('')}<div class="full row between"><span class="small muted">Vaganje ujutro, nakon WC-a, prije jela.</span><button class="btn primary" type="submit">Spremi</button></div></form>`;
  return `${hello}${week}${curatedBanner()}${filled === 0 ? `<section class="card start-week"><div><h3>Što ćemo kuhati ovaj tjedan?</h3><p class="small muted">Složi svih 21 obrok, pa prilagodi po želji.</p></div><button class="btn primary" data-action="suggest-week-here">${ic('spark')}Složi tjedan</button></section>` : ''}
  <section class="stack meals-section" id="meals"><div class="sect-h"><div><span class="eyebrow">Vaš dnevni jelovnik</span><h2>${isToday ? 'Što danas kuhamo?' : 'Planirani obroci'}</h2></div><span class="meal-progress">${ic('check')} ${planned ? eatenN + ' / ' + planned + ' pojedeno' : 'Još nema plana'}</span></div><div class="timeline">${meals}</div></section>
  <div class="today-secondary"><div class="col">${flow}${snacksCard}<details class="card disclosure" id="today-log"><summary><span>${ic('list')} Dnevnik</span><span class="small muted">Težina i trening ${ic('down')}</span></summary><div class="disclosure-body">${quick}</div></details></div><div class="col">${summary}<div class="quiet-note">${ic('pot')}<p>Jedno kuhanje, tri tanjura.<br><span class="muted">Porcije su već prilagođene vašoj obitelji.</span></p></div></div></div>`;
}

/* ---------- Recepti ---------- */
const FILTERS = [['kvinoja', 'Kvinoja'], ['heljda', 'Heljda'], ['tofu', 'Tofu'], ['junetina', 'Junetina'], ['ramstek', 'Ramstek'], ['biftek', 'Biftek'], ['riba', 'Riba'], ['bez mesa', 'Bez mesa'], ['za ponijeti', 'Za ponijeti'], ['hladno OK', 'Hladno OK'], ['zamrzivo', 'Zamrzivo'], ['brzo15', '≤ 15 min'], ['slatko', 'Slatko'], ['slano', 'Slano']];
function recipeMatches(r) {
  if (state.favoritesOnly && !favorites().has(r.id)) return false;
  for (const t of state.rtags) { if (t === 'brzo15') { if (r.time > 15) return false; } else if (t === 'bez mesa') { if (!['jaja', 'mlijecno', 'mahunarke'].includes(r.protein)) return false; } else if (t === 'riba') { if (r.protein !== 'riba') return false; } else if (t === 'junetina') { if (!Object.keys(wholeOf(r)).some(iid => ['junetina_mljevena', 'ramstek', 'biftek', 'juneca_plecka'].includes(iid))) return false; } else if (!r.tags.includes(t)) return false; }
  const q = searchText(state.rq.trim());
  if (q && ![r.title, r.sub, PROT[r.protein], ...Object.keys(wholeOf(r)).map(iid => ING[iid].name)].some(v => searchText(v).includes(q))) return false;
  return true;
}
function viewRecipes() {

  const head = `<section class="pagehead"><span class="eyebrow">Naša mala kuharica</span><h1>Dobro je jesti zajedno.</h1><p class="muted">${RECIPES.length} ${({one:'obiteljski recept',few:'obiteljska recepta',other:'obiteljskih recepata'})[new Intl.PluralRules('hr').select(RECIPES.length)]}, s porcijama za sve vas.</p></section>`;
  if (state.rmeal === 'snacks') return `${head}${seg}<section class="rgrid">${SNACKS.map(sn => `<article class="rcard" data-key="${sn.id}"><div class="img">${pic(sn.id, sn.title)}<span class="tm">${esc(sn.when)}</span></div><div class="body"><h3>${esc(sn.title)}</h3><p class="meta">${esc(sn.sub)}</p>${ADULTS.map(p => `<p class="meta">${av(p)} <strong>${fmt(sn.nut[p].kcal)} kcal</strong> · ${Object.entries(sn.per[p]).filter(([, g]) => g > 0).map(([iid, g]) => `${fmtGrams(iid, g)} ${lc(shortName(iid))}`).join(', ')}</p>`).join('')}</div></article>`).join('')}</section><p class="small muted">Pojedene međuobroke označi na kartici „Danas”.</p>`;
  const list = RECIPES.filter(r => (state.rmeal === 'all' || r.meal === state.rmeal) && recipeMatches(r));

  return `${head}<section class="recipe-tools stack"><div class="row nowrap"><div class="search grow">${ic('search', '')}<input type="search" id="rq" value="${esc(state.rq)}" placeholder="Što ti se jede? Traži jelo ili namirnicu…" autocomplete="off" aria-label="Traži recepte"></div><button class="btn favorites-filter ${state.favoritesOnly ? 'primary' : 'outline'}" data-action="favorites-only" aria-label="Prikaži samo favorite" aria-pressed="${state.favoritesOnly}">${ic('heart')}<span>Favoriti</span></button></div>${seg}<div class="chips scroll">${FILTERS.map(([k,v]) => `<button class="chip ${state.rtags.has(k) ? 'on' : ''}" data-action="rtag" data-t="${k}" aria-pressed="${state.rtags.has(k)}">${v}</button>`).join('')}</div></section>
  <div class="row between results-line"><span class="small muted" role="status">${list.length} ${({one:'recept',few:'recepta',other:'recepata'})[new Intl.PluralRules('hr').select(list.length)]}${state.favoritesOnly ? ' u favoritima' : ' za vaš stol'}</span>${filtered ? '<button class="text-btn" data-action="clear-filters">Poništi filtere</button>' : ''}<span class="small muted photo-note">Slike jela izrađene uz AI</span></div>
  <section class="rgrid">${list.map(r => `<article class="rcard" data-key="${r.id}"><div class="img"><button class="recipe-photo" data-action="open-recipe" data-id="${r.id}" aria-label="Otvori recept: ${esc(r.title)}">${pic(r.id)}</button><span class="pill glass ${r.protein}">${PROT[r.protein]}</span>${favoriteButton(r)}<span class="tm">${ic('clock', '')}${r.time} min</span></div><div class="body"><span class="eyebrow">${MEALS[r.meal]}</span><h3><button data-action="open-recipe" data-id="${r.id}">${esc(r.title)}</button></h3><div class="meta">${splitLine(r)}</div><button class="text-btn add-plan" data-action="add-to-plan" data-id="${r.id}">${ic('plus')}Dodaj u plan</button></div></article>`).join('') || `<div class="blank empty-recipes">${ic(state.favoritesOnly ? 'heart' : 'search')}<h3>${state.favoritesOnly ? 'Ovdje čuvamo omiljena jela.' : 'Još nismo našli to jelo.'}</h3><p>${state.favoritesOnly ? 'Dodirni srce na receptu da ti uvijek bude pri ruci, ili promijeni filtere.' : 'Pokušaj s drugom namirnicom ili ukloni filtere.'}</p><button class="btn soft" data-action="clear-filters">Prikaži recepte</button></div>`}</section>`;
}
/* Sastojci: zajednički lonac po grupama + dodaci na tanjur po osobi. Ključevi za kvačice ne ovise o količini. */
function ingList(r, mult) {
  const m = model(r);
  const groups = r.groups.map((name, gi) => {
    const ents = r.batch.filter(e => e[0] === gi); if (!ents.length) return '';
    const eat = Math.min(...ents.map(e => e[3]));
    const rows = ents.map(e => {
      const iid = e[1], k = `${r.id}:b:${ekey(e)}`, on = state.got.has(k);
      const without = PEOPLE.filter(p => isBez(m, p, e));
      return `<button class="ing" data-action="toggle-ing" data-k="${k}" data-key="${k}" aria-pressed="${on}"><span class="check sm ${on ? 'on' : ''}">${ic('check', '')}</span><span class="nm">${esc(ING[iid].name)}${ING[iid].note ? ` <small>(${esc(ING[iid].note)})</small>` : ''}${without.length ? `<small class="bezn"> · bez: ${without.map(p => esc(pname(p))).join(', ')}</small>` : ''}</span><span class="q">${fmtGrams(iid, cooked(r, e, m) * mult)}</span></button>`;
    }).join('');
    return `<div class="ing-h">${esc(name)}${eat < 0.97 ? ` <em>oko ${Math.round(100 - eat * 100)} % ostaje za sutra</em>` : ''}</div>${rows}`;
  }).join('');
  const extras = PEOPLE.flatMap(p => Object.entries(m.extras[p] || {}).map(([iid, g]) => {
    const k = `${r.id}:x:${p}:${iid}`, on = state.got.has(k);
    return `<button class="ing" data-action="toggle-ing" data-k="${k}" data-key="${k}" aria-pressed="${on}"><span class="check sm ${on ? 'on' : ''}">${ic('check', '')}</span><span class="nm">${esc(ING[iid].name)} <small>· samo ${esc(pname(p))}</small></span><span class="q">+ ${fmtGrams(iid, g * mult)}</span></button>`;
  })).join('');
  return `${groups}${extras ? `<div class="ing-h">Dodaci na tanjur <em>ne idu u lonac</em></div>${extras}` : ''}`;
}
function timerChip(key, t, label) {
  const run = timers.find(x => x.key === key && !x.done);
  return `<button class="tchip ${run ? 'run' : ''}" data-action="timer" data-tkey="${key}" data-sec="${t.sec}" data-label="${esc(label)}" data-text="${esc(t.label)}">${ic('clock', '')}<span>${run ? mmss(run) : t.label}</span></button>`;

/* kartica porcije jedne osobe: postotak, kcal, glavne namirnice, što se ne stavlja i dodaci */
function portionCard(r, p, editable = true) {
  const m = model(r), n = rnut(r, p);
  const bez = r.batch.filter(e => isBez(m, p, e)).map(e => e[1]).filter((v, i, a) => a.indexOf(v) === i);
  const ex = Object.entries(m.extras[p] || {});
  return `<div class="p ${p}" data-key="pc-${p}"><h4>${av(p)}<span>${esc(pname(p))}</span><span class="pc">${pct(p)} %</span></h4><div class="kc">${fmt(n.kcal)} kcal · ${fmt(n.p)} g proteina</div>
    <ul>${portionItems(r, p).map(([iid, g]) => `<li><span>${fmtGrams(iid, g)}</span> ${esc(lc(shortName(iid)))}</li>`).join('')}</ul>
    ${bez.length || ex.length ? `<div class="chips">${bez.map(iid => `<span class="chip tag minus">bez: ${esc(lc(ingName(iid)))}</span>`).join('')}${ex.map(([iid, g]) => `<span class="chip tag plus">+ ${fmtGrams(iid, g)} ${esc(lc(ingName(iid)))}</span>`).join('')}</div>` : ''}
    ${editable ? `<button class="btn sm outline" data-action="portion-edit" data-id="${r.id}" data-p="${p}">${ic('list')}Prilagodi</button>` : ''}</div>`;
}
function viewRecipeDetail(r) {

/* ---------- Plan ---------- */
function viewPlan() {
  const ws = state.weekStart, plan = getPlan(ws), s = settings(); const td = today();
  const all = plan.days.flatMap(d => SLOTS.map(([k]) => d[k]).filter(id => id && RB[id]));
  const cnt = pr => all.filter(id => RB[id].protein === pr).length;
  const fish = cnt('riba'), red = cnt('crveno'), poultry = cnt('perad');
  const dk = (date, p) => dayNut(date, p, false).kcal || 0;
  const avgK = p => plan.days.reduce((a, d, i) => a + dk(isoDate(addDays(parseDate(ws), i)), p), 0) / 7;
  const days = plan.days.map((d, i) => {
    const date = isoDate(addDays(parseDate(ws), i)); const has = SLOTS.some(([k]) => d[k] && RB[d[k]]);
    const slots = SLOTS.map(([k, meal]) => { const r = RB[d[k]]; return `<button class="slot ${r ? '' : 'vacant'}" data-action="pick-slot" data-ws="${ws}" data-di="${i}" data-slot="${k}" data-key="${k}"><span class="th">${r ? pic(r.id) : ic('plus')}</span><span style="min-width:0"><span class="k">${MEALS[meal]}</span><span class="v ${r ? '' : 'empty'}">${r ? esc(r.title) : 'Odaberi jelo'}</span></span><span class="kc">${r ? r.time + ' min' : ''}</span></button>`; }).join('');
    const flags = `<div class="dayflags"><button class="chip ${d.montaza ? 'on' : ''}" data-action="toggle-montaza" data-ws="${ws}" data-di="${i}" aria-pressed="${!!d.montaza}">${d.montaza ? '✓ montaža · hladni ručak' : 'Montaža?'}</button>${ADULTS.filter(p => s.trainingDays[p].includes(i)).map(p => `<span class="chip tag">trening ${esc(pname(p))}</span>`).join('')}</div>`;
    return `<article class="daycard ${date === td ? 'today' : ''}" style="--d:${i}" data-key="${date}"><div class="dh"><h3>${DAYS_LONG[i]} <small>${fmtDate(date)}${date === td ? ' · danas' : ''}</small></h3>${has ? `<span class="sl">${PEOPLE.map(p => `<span title="${esc(pname(p))}">${mini(p)}${fmt(dk(date, p))}</span>`).join('')}<span class="u">kcal</span></span>` : ''}</div><div class="slots">${slots}</div>${flags}</article>`;
  }).join('');
  const freezeHints = [...new Set(plan.days.flatMap(d => SLOTS.map(([k]) => d[k]).filter(id => id && RB[id] && RB[id].freeze && RB[id].meal === 'vecera')))].map(id => RB[id].title.split(' s ')[0]);
  const stat = (lab, val, ok) => `<span class="stat ${ok === true ? 'ok' : (ok === false ? 'warn' : '')}">${lab} <b>${val}</b></span>`;
  return `<section class="pagehead"><span class="eyebrow">Manje razmišljanja, više uživanja</span><h1>Tjedan po vašem ukusu.</h1><p class="muted">Složi plan jednim dodirom. Svaki obrok lako zamijeniš.</p></section>
  ${curatedBanner()}${state.docs['planner/latest'] ? `<button class="text-btn" data-action="restore-curated">${ic('undo')}Vrati plan prije pripremljenog jelovnika</button>` : ''}
  <section class="stack">${weekNav(ws, all.length ? `${all.length}/21 obroka` : '')}
    ${all.length ? `<div class="stats">${stat('Riba', fish + '×', fish >= s.fishPerWeek)}${stat('Crveno meso', red + '×', red <= 3 ? null : false)}${stat('Perad', poultry + '×', poultry <= 5 ? null : false)}${ADULTS.map(p => stat('Prosjek · ' + esc(pname(p)), fmt(avgK(p)) + ' kcal', null)).join('')}</div>` : ''}
    <div class="actions"><button class="btn primary" data-action="suggest-week">${ic('spark')}${all.length ? 'Novi prijedlog' : 'Predloži tjedan'}</button>${all.length && all.length < 21 ? `<button class="btn soft" data-action="suggest-week-fill">${ic('plus')}Popuni prazno</button>` : ``}${all.length ? `<button class="btn outline danger" data-action="clear-week">${ic('trash')}Očisti</button>` : ''}</div></section>
  <section class="days ${state.fresh ? 'fresh' : ''}">${days}</section>
  <section class="card"><details class="more" id="plan-rules" style="border:0;padding:0"><summary>Kako slažem prijedlog ${ic('down', '')}</summary><div class="rules">
    <div><b>Pravila:</b> riba ${fmt(s.fishPerWeek)}× tjedno (jedan riblji obrok je losos ili srdele zbog omega-3), crveno meso najviše 2–3×, perad najviše 4–5×, bez ponavljanja jela unutar tjedna, uz izmjenu recepata između tjedana, isti izvor proteina ne ide dvaput u danu, izmjena slatkih i slanih doručaka. Na dan montaže ručak je hladni.</div>
    <div><b>Porcije:</b> svako jelo kuha se jednom za sve i dijeli u omjeru ${pct('T')} : ${pct('S')} : ${pct('K')} (${esc(pname('T'))} : ${esc(pname('S'))} : ${esc(pname('K'))}).</div>

    <div>Dodirni bilo koji obrok da ga zamijeniš; „Popuni prazno” zadržava ono što si već odabrao.</div></div></details></section>`;
}

function personProgress(p) {
  const s = settings(); const w = series(p, 'weight'), wa = series(p, 'waist');
  const avg = movingAvg(w, 7); const cur = avg.length ? avg[avg.length - 1].v : null;
  const fourWeeksAgo = w.length ? avg.filter(q => (parseDate(w[w.length - 1].date) - parseDate(q.date)) / 864e5 >= 26) : []; const ref = fourWeeksAgo.length ? fourWeeksAgo[fourWeeksAgo.length - 1].v : null;
  const delta = (cur !== null && ref !== null) ? cur - ref : null;
  const tr = trainingsThisWeek(p); const sug = suggestionText(p);
  const goodDir = d => d === null ? '' : ((s.goals[p] === 'loss' ? d < 0 : d > 0) ? 'up' : 'down');
  const recent = Object.values(state.logs).filter(l => l[p] && (l[p].weight !== undefined || l[p].waist !== undefined || l[p].training)).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 7);
  const weeks = {}; w.forEach(q => { const k = isoDate(mondayOf(parseDate(q.date))); (weeks[k] = weeks[k] || []).push(q.v); });
  const weekKeys = Object.keys(weeks).sort().slice(-8); let prevAvg = null;
  const weekRows = weekKeys.map(k => { const a = weeks[k].reduce((x, y) => x + y) / weeks[k].length; const d = prevAvg === null ? null : a - prevAvg; prevAvg = a; let trs = 0; for (let i = 0; i < 7; i++) { const l = getLog(isoDate(addDays(parseDate(k), i)))[p]; if (l && l.training) trs++; }
    return `<tr><td>${weekLabel(k)}</td><td class="n">${fmt(a, 1)}</td><td class="n ${goodDir(d)}">${d === null ? '–' : (d > 0 ? '+' : '') + fmt(d, 1)}</td><td class="n">${weeks[k].length}</td><td class="n">${trs}</td></tr>`; }).reverse().join('');
  return `<section class="stack" data-key="np-${p}"><div class="person-h">${av(p)}<div><h2>${esc(pname(p))}</h2><span class="small muted">${s.goals[p] === 'gain' ? 'lagani dobitak mišića' : 'gubitak masti uz očuvanje mišića'} · ${pct(p)} % zajedničkog jela</span></div></div>
  <div class="tiles">
    <div class="tile2"><div class="lab">Težina · 7-dn. prosjek</div><div class="v num">${cur === null ? '–' : fmt(cur, 1)}<small> kg</small></div></div>
    <div class="tile2"><div class="lab">Promjena · 4 tjedna</div><div class="v num ${goodDir(delta)}">${delta === null ? '–' : (delta > 0 ? '+' : '') + fmt(delta, 1)}<small> kg</small></div></div>
    <div class="tile2"><div class="lab">Treninzi ovaj tjedan</div><div class="v num">${tr}<small> / ${s.trainingDays[p].length || (s.goals[p] === 'gain' ? 5 : 3)} plan</small></div></div>
    <div class="tile2"><div class="lab">Mjerenja</div><div class="v num">${w.length}</div><small class="muted">${w.length ? 'zadnje ' + fmtDate(w[w.length - 1].date) : 'još nema'}</small></div></div>
  <div class="card stack sugg"><span class="verdict ${sug.kind}">${sug.kind === 'ok' ? '✓ U cilju' : (sug.kind === 'act' ? 'Prijedlog korekcije' : 'Prikupljanje podataka')}</span><h3>${esc(sug.title)}</h3><p>${esc(sug.text)}</p><p class="small muted">Pravilo: ${s.goals[p] === 'gain' ? 'cilj +0,1 do +0,2 kg/tj. (lagani dobitak mišića); ispod toga +150 kcal, iznad +0,3 kg/tj. −150 kcal' : 'cilj −0,4 do −0,5 kg/tj.; sporije od −0,3 → −100–150 kcal ili više kretanja; brže od −0,7 → +100–150 kcal'}. Trend se računa iz zadnjih 28 dana. Kalorije mijenjaš postotkom u Postavkama ili međuobrocima.</p></div>
  <div class="card stack"><div class="sect-h"><h3>Težina</h3><div class="legend"><span><i></i>mjerenja</span><span><i class="avg"></i>7-dn. prosjek</span></div></div>${lineChart(w, { unit: 'kg', label: 'Težina kroz vrijeme · ' + pname(p), minPad: 0.5 })}</div>
  ${wa.length ? `<div class="card stack"><h3>Opseg struka</h3>${lineChart(wa, { unit: 'cm', label: 'Opseg struka · ' + pname(p), minPad: 1 })}</div>` : ''}
  ${weekRows ? `<div class="card stack"><h3>Po tjednima</h3><div class="scrollx"><table class="tbl"><thead><tr><th>Tjedan</th><th class="n">kg</th><th class="n">Δ</th><th class="n">mj.</th><th class="n">tren.</th></tr></thead><tbody>${weekRows}</tbody></table></div></div>` : ''}
  ${recent.length ? `<div class="card entries"><h3 style="margin-bottom:6px">Zadnji unosi</h3><ul>${recent.map(l => `<li data-key="${p}-${l.date}"><span>${fmtDateLong(l.date)}</span><span class="num muted">${l[p].weight !== undefined ? fmt(l[p].weight, 1) + ' kg' : ''}${l[p].waist !== undefined ? ' · ' + fmt(l[p].waist, 1) + ' cm' : ''}${l[p].training ? ' · trening' : ''}</span><button class="btn sm danger" data-action="del-entry" data-p="${p}" data-date="${l.date}" aria-label="Obriši unos ${fmtDate(l.date)}">${ic('trash')}</button></li>`).join('')}</ul></div>` : ''}</section>`;
}

      if (w !== null) patch.weight = w; if (wa !== null) patch.waist = wa; if (fv(f, 'training-' + p)) patch.training = true;
      if (Object.keys(patch).length) { log[p] = Object.assign(log[p] || {}, patch); any = true; }
    }
    if (!any) return toast('Unesi težinu, struk ili trening.', 'info');
    saveLog(log); ADULTS.forEach(p => ['le-weight-', 'le-waist-'].forEach(id => { const el = document.getElementById(id + p); if (el) el.value = ''; })); toast('Spremljeno: ' + fmtDateLong(date));
  } else if (f.dataset.action === 'save-settings') {
    const s = settings(); const fd = new FormData(f); const nv = (k, d) => { const v = parseFloat(String(fd.get(k) || '').replace(',', '.')); return isNaN(v) ? d : v; };
    for (const p of PEOPLE) s.names[p] = (fd.get('name-' + p) || s.names[p]).toString().trim() || s.names[p];
    const sp = Object.fromEntries(PEOPLE.map(p => [p, Math.max(0, Math.round(nv('split-' + p, (s.split || DEFAULTS.split)[p])))]));
    const sum = PEOPLE.reduce((a, p) => a + sp[p], 0);
    if (!sum) return toast('Udio mora biti veći od nule.', 'info');
    if (sum !== 100) { PEOPLE.forEach(p => { sp[p] = Math.round(sp[p] * 100 / sum); }); sp.T += 100 - PEOPLE.reduce((a, p) => a + sp[p], 0); }
    s.split = sp;
    for (const p of ADULTS) { s.goals[p] = fd.get('goal-' + p) || s.goals[p]; s.targets[p] = { kcal: nv('kcal-' + p, s.targets[p].kcal), p: nv('p-' + p, s.targets[p].p), c: nv('c-' + p, s.targets[p].c), f: nv('f-' + p, s.targets[p].f) }; s.trainingDays[p] = fd.getAll('td-' + p).map(Number); }
    s.fishPerWeek = nv('fish', s.fishPerWeek);
    if (sum !== 100) { saveDoc('settings/main', s); toast(`Udjeli su preračunati na 100 %: ${sp.T} / ${sp.S} / ${sp.K}.`, 'info'); return; }
    saveDoc('settings/main', s); toast('Postavke su spremljene.');
  }
});
window.addEventListener('hashchange', () => { const hadRecipe = !!state.recipe; applyHash(); render(); if (hadRecipe && !state.recipe) scrollTop(state.listScroll); });
let rsz = null; window.addEventListener('resize', () => { if (state.view !== 'napredak') return; clearTimeout(rsz); rsz = setTimeout(render, 150); });
let spy = 0;
window.addEventListener('scroll', () => {
  if (spy) return; spy = requestAnimationFrame(() => {
    spy = 0; const top = document.getElementById('top'); if (top) top.classList.toggle('scrolled', scroller().scrollTop > 4);
    if (state.view === 'recepti' && state.recipe) {
      let cur = 'sec-porcije'; ['sec-porcije', 'sec-sastojci', 'sec-priprema', 'sec-nutrijenti'].forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 160) cur = id; });
      if (cur !== state.sec) { state.sec = cur; document.querySelectorAll('.subnav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.t === cur))); }
    }
  });
}, { passive: true });
function applyHash() { const h = location.hash.slice(1), parts = h.split('/'); if (parts[0] === 'recepti' && RB[parts[1]]) { state.view = 'recepti'; state.recipe = parts[1]; } else if (VIEWS.includes(h) || !h) { state.view = h || 'danas'; state.recipe = null; } }

/* ===================== Pokretanje ===================== */
async function boot() {
  document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'dark' ? '#17221F' : '#F8F7F3';
  webBoot(); applyHash(); ensureWatches(); render();
  try {
    const cl = WEB ? null : window.claude;
    if (cl && typeof cl.use === 'function') {
      const [db, user, assets] = await Promise.all([cl.use('db'), cl.use('user'), cl.use('assets')]);
      state.user = user; state.assets = assets;
      if (db) {
        let can = null; try { can = user ? await user.can('data.write') : null; } catch (e) { can = null; }
        if (can === false) { state.mode = 'local'; state.writable = false; }
        else { state.db = db; state.mode = 'db'; state.writable = can; resetSubs(); state.docs = {}; state.logs = {}; }
      }
    }
  } catch (e) { console.warn('capabilities', e); }
  state.dbReady = true; ensureWatches(); render();
}
boot();
