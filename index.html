<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Obiteljski jelovnik: tjedni plan, recepti, kupovina i kuhanje korak po korak.">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E161A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Za naš stol">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Za naš stol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: mobitel prvo – jedan stupac (do 760 px) sa staklenim zaglavljem i plutajućom trakom kartica pri dnu;
   od 1024 px lijeva traka navigacije i širi sadržaj. Boju nose ilustracije jela; sučelje je mirno:
   jadranska plava za radnje, maslinasta za "pojedeno/kupljeno", limun za "danas/sljedeće". */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EBF0EC; --surface-3:#DFE6E1; --ink:#14232A; --muted:#5A696E; --line:#DCE3DE;
  --sea:#1C5D78; --sea-ink:#FFFFFF; --sea-soft:#DDEDF3; --sea-deep:#123F52;
  --olive:#56772F; --olive-ink:#FFFFFF; --olive-soft:#E6EEDA;
  --citrus:#E9A920; --citrus-ink:#2A1E00; --citrus-soft:#FCF0CF;
  --tomato:#C9432B; --tomato-soft:#FAE3DC; --warn:#A86A0B;
  --pT:#1C5D78; --pS:#B24E72; --pK:#C98A0E;
  --scrim:rgba(12,22,27,.42); --glass:rgba(243,245,242,.78); --glass-strong:rgba(255,255,255,.86);
  --shadow-1:0 1px 2px rgba(20,35,42,.06),0 2px 8px rgba(20,35,42,.05);
  --shadow-2:0 2px 6px rgba(20,35,42,.07),0 14px 34px rgba(20,35,42,.11);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-lg:24px; --r:18px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1); --rail:240px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E161A; --surface:#162127; --surface-2:#1D2A31; --surface-3:#26353D; --ink:#E6EEF0; --muted:#97A8AE; --line:#26353C;
  --sea:#7CC4DE; --sea-ink:#06202B; --sea-soft:#163747; --sea-deep:#A9DCEE;
  --olive:#A6C97B; --olive-ink:#132006; --olive-soft:#1F3119;
  --citrus:#F4C452; --citrus-ink:#2A1E00; --citrus-soft:#3A2F12;
  --tomato:#F2896F; --tomato-soft:#3D2420; --warn:#E9B14E;
  --pT:#7CC4DE; --pS:#EE93B4; --pK:#F4C452;
  --scrim:rgba(0,0,0,.55); --glass:rgba(14,22,26,.78); --glass-strong:rgba(22,33,39,.9);
  --shadow-1:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E161A; --surface:#162127; --surface-2:#1D2A31; --surface-3:#26353D; --ink:#E6EEF0; --muted:#97A8AE; --line:#26353C;
  --sea:#7CC4DE; --sea-ink:#06202B; --sea-soft:#163747; --sea-deep:#A9DCEE;
  --olive:#A6C97B; --olive-ink:#132006; --olive-soft:#1F3119;
  --citrus:#F4C452; --citrus-ink:#2A1E00; --citrus-soft:#3A2F12;
  --tomato:#F2896F; --tomato-soft:#3D2420; --warn:#E9B14E;
  --pT:#7CC4DE; --pS:#EE93B4; --pK:#F4C452;
  --scrim:rgba(0,0,0,.55); --glass:rgba(14,22,26,.78); --glass-strong:rgba(22,33,39,.9);
  --shadow-1:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.75rem,6vw,2.35rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.45rem}
h3{font-size:1.12rem}
p{margin:0}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--sea);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important;border:0!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- zaglavlje ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:var(--font-display);font-size:1.12rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.brand small{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--muted);font-weight:600;white-space:nowrap}
.brand small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.6}
.brand small.live::before{background:var(--olive);opacity:1;box-shadow:0 0 0 3px var(--olive-soft)}
.top-r{display:flex;align-items:center;gap:8px}
.persons{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.persons button{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.persons button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-weight:800;font-size:.78rem;color:#fff;background:var(--pT);flex:none;font-family:var(--font-display)}
.av.S{background:var(--pS)}.av.K{background:var(--pK)}
:root:not([data-theme="light"]) .av{color:var(--surface)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .av{color:#fff} }
:root[data-theme="light"] .av{color:#fff}
@media (max-width:420px){.persons button span{display:none}.persons button{padding:4px}}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--ink);flex:none}
.icon-btn.ghost{background:transparent}
.icon-btn[aria-current="page"]{background:var(--sea-soft);color:var(--sea)}

/* ---------- navigacija: plutajuća traka (mobitel) / lijeva traka (desktop) ---------- */
nav.tabs{position:fixed;z-index:9;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{position:relative;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--glass-strong);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow-2)}
nav.tabs button{position:relative;z-index:1;display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.01em;border-radius:20px}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--sea)}
nav.tabs .ind{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:20px;background:var(--sea-soft);transform:translateX(calc(var(--i,0) * 100%));transition:transform .38s var(--ease)}
nav.tabs .ind.off{opacity:0}
nav.tabs .rail-brand,nav.tabs .rail-foot{display:none}
nav.tabs .badge{position:absolute;top:3px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--citrus);color:var(--citrus-ink);font-size:.62rem;display:grid;place-items:center;font-weight:800}
@media (min-width:1024px){
  nav.tabs{left:0;right:auto;top:0;bottom:0;width:var(--rail);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);border-right:1px solid var(--line);background:var(--surface)}
  nav.tabs .in{height:100%;max-width:none;display:flex;flex-direction:column;gap:4px;background:none;border:0;border-radius:0;box-shadow:none;padding:20px 14px;-webkit-backdrop-filter:none;backdrop-filter:none}
  nav.tabs .rail-brand{display:flex;padding:4px 10px 22px}
  nav.tabs button{display:flex;align-items:center;gap:12px;padding:11px 14px;font-size:.98rem;font-weight:600;border-radius:14px;justify-items:start}
  nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
  nav.tabs button[aria-current="page"]{background:var(--sea-soft);color:var(--sea)}
  nav.tabs .ind{display:none}
  nav.tabs .badge{position:static;margin-left:auto}
  nav.tabs .rail-foot{display:block;margin-top:auto;padding:12px 10px 0;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
  .top .brand{visibility:hidden}
  .top,main,#timers-root{margin-left:var(--rail)}
  .top-in{max-width:1100px}
}

/* ---------- glavni sadržaj ---------- */
main{max-width:760px;margin:0 auto;padding-block:8px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
@media (min-width:1024px){main{max-width:calc(1100px + var(--rail));padding-left:calc(var(--rail) + 40px);padding-right:40px;margin-left:0;padding-bottom:64px}}
main > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.flat{background:var(--surface-2);border-color:transparent}
.stack{display:grid;gap:12px}
.stack > *,.card > *{min-width:0}
.stack.tight{gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sect-h h2,.sect-h h3{min-width:0}
.pagehead{display:grid;gap:4px;padding-top:6px}
.pagehead .row{justify-content:space-between}

/* gumbi */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:.92rem;background:var(--surface-2);color:var(--ink);border:1px solid transparent;min-height:42px;white-space:nowrap}
.btn.primary{background:var(--sea);color:var(--sea-ink)}
.btn.olive{background:var(--olive);color:var(--olive-ink)}
.btn.outline{background:transparent;border-color:var(--line)}
.btn.soft{background:var(--sea-soft);color:var(--sea)}
.btn.lg{min-height:54px;padding:14px 22px;font-size:1.02rem;border-radius:18px}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.84rem}
.btn.danger{color:var(--tomato)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px;scroll-padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:.84rem;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line);white-space:nowrap;flex:none}
.chip.on{background:var(--sea);color:var(--sea-ink);border-color:var(--sea)}
.chip.tag{background:var(--surface-2);border-color:transparent;color:var(--muted);padding:4px 10px;font-size:.78rem}
.chip .k{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.chip.on .k{color:inherit;opacity:.8}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.01em;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc,var(--muted))}
.pill.riba{--pc:#3E86B0}.pill.perad{--pc:#D9A13A}.pill.crveno{--pc:#B8452F}.pill.svinjetina{--pc:#D97C8E}.pill.jaja{--pc:#E9C13C}.pill.mlijecno{--pc:#8FA4C9}.pill.mahunarke{--pc:#7B9A47}
.pill.glass{background:var(--glass-strong);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 15px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap;flex:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg.full{display:flex}.seg.full button{flex:1}
.seg .n{font-weight:600;opacity:.6;margin-left:3px;font-variant-numeric:tabular-nums}
@media (max-width:440px){.seg .n{display:none}.seg button{padding:8px 12px}}

/* oznaka "pojedeno / kupljeno" */
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;color:transparent;background:var(--surface);flex:none}
.check.on{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.check svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check.sm{width:26px;height:26px}.check.sm svg{width:14px;height:14px}

/* trake i prsten */
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sea);border-radius:999px}
.bar i.good{background:var(--olive)}
.bar i.over{background:var(--citrus)}
.ring{display:block}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--sea);stroke-linecap:round}
.ring .val.good{stroke:var(--olive)}.ring .val.over{stroke:var(--citrus)}

/* ---------- Danas ---------- */
.hello{display:grid;gap:2px;padding-top:6px}
.hello h1 span{color:var(--sea)}
.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:center}
.week .icon-btn{width:30px;height:30px;background:transparent;color:var(--muted)}
.wday{display:grid;justify-items:center;gap:3px;padding:8px 0 7px;border-radius:16px;min-width:0}
.wday small{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wday b{font-family:var(--font-display);font-size:1.1rem;line-height:1;font-weight:700}
.wday .pips{display:flex;gap:3px;height:6px}
.wday .pips i{width:6px;height:6px;border-radius:50%;background:var(--surface-3)}
.wday .pips i.p{background:var(--muted);opacity:.45}
.wday .pips i.e{background:var(--olive);opacity:1}
.wday.today b{color:var(--sea)}
.wday[aria-current="date"]{background:var(--sea);color:var(--sea-ink)}
.wday[aria-current="date"] small,.wday[aria-current="date"] b{color:var(--sea-ink)}
.wday[aria-current="date"] .pips i{background:color-mix(in srgb,var(--sea-ink) 30%,transparent)}
.wday[aria-current="date"] .pips i.p{background:var(--sea-ink);opacity:.6}
.wday[aria-current="date"] .pips i.e{background:var(--citrus);opacity:1}
.daynote{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}

.summary{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.summary .ringbox{position:relative;width:136px;height:136px}
.summary .ringbox .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:0}
.summary .ringbox .c b{font-family:var(--font-display);font-size:1.6rem;line-height:1;font-weight:800;letter-spacing:-.02em}
.summary .ringbox .c small{font-size:.74rem;color:var(--muted);font-weight:600}
.macros{display:grid;gap:12px;min-width:0}
.macro .l{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;margin-bottom:5px}
.macro .l span{font-weight:700}
.macro .l em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:380px){.summary{grid-template-columns:1fr;justify-items:center}.macros{width:100%}}

.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative}
.flow button{display:grid;justify-items:center;text-align:center;gap:6px;padding:4px 4px;position:relative;min-width:0}
.flow button::before{content:"";position:absolute;top:19px;left:calc(-50% + 22px);right:calc(50% + 22px);height:2px;background:var(--surface-3);border-radius:2px}
.flow button:first-child::before{display:none}
.flow button.done::before,.flow button.cur::before{background:var(--olive)}
.flow .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;background:var(--surface-2);color:var(--muted);border:2px solid transparent}
.flow .done .dot{background:var(--olive);color:var(--olive-ink)}
.flow .cur .dot{background:var(--surface);border-color:var(--sea);color:var(--sea);box-shadow:0 0 0 5px var(--sea-soft)}
.flow .dot svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow b{font-size:.86rem;line-height:1.2}
.flow small{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}

.timeline{display:grid;gap:12px}
.mcard{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px 10px 10px;position:relative;transition:border-color .25s,box-shadow .25s}
.mcard .thumb{width:96px;height:96px;border-radius:16px;overflow:hidden;position:relative;background:var(--surface-2);display:block}
.mcard .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .35s,transform .35s var(--ease)}
.mcard .t{min-width:0;display:grid;gap:3px}
.mcard .t .title{font-weight:700;font-size:1rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.mcard .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mcard .meta b{color:var(--ink);font-weight:700}

.list{display:grid;gap:4px}
.list .item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:6px;border-radius:16px}
.list .item .th{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-family:var(--font-display)}
.list .item .th img{width:100%;height:100%;object-fit:cover;display:block}
.list .item b{font-weight:700;line-height:1.25}
.list .item.sel{background:var(--sea-soft)}
@media (hover:hover){.list .item:hover{background:var(--surface-2)}.list .item.sel:hover{background:var(--sea-soft)}}
.list .item .sub{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.dialog-text{color:var(--muted)}

/* ---------- način kuhanja ---------- */
.cook{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:820px;width:100%;margin:0 auto}
.cook-top .ttl{min-width:0;text-align:center}
.cook-top .ttl b{display:block;font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook-top .ttl small{color:var(--muted);font-size:.8rem;font-weight:600}
.cook-prog{display:flex;gap:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:820px;width:100%;margin:0 auto}
.cook-prog i{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;position:relative}
.cook-prog i::after{content:"";position:absolute;inset:0;background:var(--sea);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.cook-prog i.on::after{transform:scaleX(1)}
.cook-body{overflow:auto;overscroll-behavior:contain;padding-block:24px 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.cook-step{max-width:720px;margin:0 auto;display:grid;gap:18px;align-content:start}
.cook-step .no{font-family:var(--font-display);font-weight:800;font-size:4.5rem;line-height:.9;color:var(--sea);letter-spacing:-.04em}
.cook-step .txt{font-size:clamp(1.3rem,4.6vw,1.85rem);line-height:1.38;font-weight:500;letter-spacing:-.01em;text-wrap:pretty}
.cook-step .pic{width:100%;max-width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden}
.cook-step .pic img{width:100%;height:100%;object-fit:cover;display:block}
.cook-step .tchip{font-size:1rem;padding:9px 16px 9px 12px}
.cook-step .tchip svg{width:20px;height:20px}
.cook-step .ings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 12px}
.cook-foot{display:grid;grid-template-columns:auto 1fr;gap:10px;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:820px;width:100%;margin:0 auto}
.cook-foot .btn{min-height:58px;border-radius:20px;font-size:1.05rem}
.cook-done{text-align:center;justify-items:center}
.cook-done .pic{max-width:420px}
.cook-done h2{font-size:2rem}

/* ---------- mjerači vremena ---------- */
#timers-root{position:fixed;z-index:31;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:end;pointer-events:none}
body.cooking #timers-root{bottom:calc(96px + env(safe-area-inset-bottom,0px));margin-left:0}
@media (min-width:1024px){#timers-root{bottom:24px}}
.timer{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px 6px 6px;box-shadow:var(--shadow-2);font-weight:700}
.timer .tr{width:34px;height:34px;flex:none}
.timer .tr .t0{stroke:color-mix(in srgb,var(--bg) 25%,transparent)}
.timer .tr .t1{stroke:var(--citrus);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer .tm{font-variant-numeric:tabular-nums;font-size:1.02rem;min-width:46px}
.timer .lb{font-size:.74rem;opacity:.7;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.timer button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.timer.done{background:var(--citrus);color:var(--citrus-ink)}
.timer.done button{background:rgba(0,0,0,.12);color:var(--citrus-ink)}

#sheet-ghost{pointer-events:none}
body.sheet-open,body.cooking{overflow:hidden}
#meals,[id^="sec-"]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}

/* ---------- obavijest ---------- */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.92rem;font-weight:600;z-index:40;box-shadow:var(--shadow-2);max-width:min(92vw,520px);text-align:center;display:flex;align-items:center;gap:8px}
.toast svg{width:18px;height:18px;stroke:var(--olive);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (min-width:1024px){.toast{bottom:28px;margin-left:calc(var(--rail) / 2)}}
body.cooking .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 76px);margin-left:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sea-soft);border-radius:var(--r);padding:14px 16px}

/* ---------- pokret ---------- */
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.check,.seg button,.slot,.wday,.icon-btn,.glassbtn,.flow .dot,.toggle,.ing,.srow,.persons button{transition:background-color .2s,color .2s,border-color .2s,transform .15s var(--ease),box-shadow .2s}
  .btn:active,.chip:active,.icon-btn:active,.wday:active,.slot:active,.glassbtn:active,.rcard:active,.check:active,.toggle:active,.srow:active{transform:scale(.96)}
  .bar i{transition:width .6s var(--ease)}
  .ring .val{transition:stroke-dashoffset .8s var(--ease),stroke .3s}
  .check.on svg,.toggle[aria-pressed="true"] i svg{animation:pop .38s var(--ease)}
  .chip.snack.on img{animation:pop .38s var(--ease)}
  .view-in > *{animation:rise .42s var(--ease) both}
  .view-in > *:nth-child(2){animation-delay:.03s}.view-in > *:nth-child(3){animation-delay:.06s}.view-in > *:nth-child(4){animation-delay:.09s}.view-in > *:nth-child(5){animation-delay:.12s}.view-in > *:nth-child(n+6){animation-delay:.15s}
  .fresh .daycard{animation:rise .5s var(--ease) both;animation-delay:calc(var(--d,0) * 45ms)}
  .sheet-bg{animation:fade .25s ease both}
  .sheet-bg .sheet{animation:up .38s var(--ease) both}
  #sheet-ghost .sheet-bg{animation:fade .24s ease reverse both}
  #sheet-ghost .sheet{animation:down .26s ease-in both}
  .cook{animation:fade .25s ease both}
  .cook-step.fwd{animation:slideL .4s var(--ease) both}
  .cook-step.back{animation:slideR .4s var(--ease) both}
  .toast{animation:toast .35s var(--ease) both}
  .timer{animation:pop .35s var(--ease) both}
  .timer.done{animation:pulse 1.2s ease-in-out infinite}
  .mcard.next{animation:glow 2.8s ease-in-out infinite}
}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{from{transform:none}to{transform:translateY(100%)}}
@keyframes slideL{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--citrus-soft)}50%{box-shadow:0 0 0 6px var(--citrus-soft)}}
@media (prefers-reduced-motion:no-preference) and (min-width:720px){.sheet-bg .sheet{animation:fade .25s ease both}#sheet-ghost .sheet{animation:fade .2s ease reverse both}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
::view-transition-group(dish){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>

/* ---------- Plan ---------- */
function viewPlan() {

  const all = plan.days.flatMap(d => SLOTS.map(([k]) => d[k]).filter(id => id && RB[id]));
  const cnt = pr => all.filter(id => RB[id].protein === pr).length;
  const fish = cnt('riba'), red = cnt('crveno'), poultry = cnt('perad');
  const avgK = all.length ? plan.days.reduce((a, d, i) => a + (dayNut(isoDate(addDays(parseDate(ws), i)), p, false).kcal || 0), 0) / 7 : 0;
  const days = plan.days.map((d, i) => {
    const date = isoDate(addDays(parseDate(ws), i)); const kcal = dayNut(date, p, false).kcal || 0;
    const slots = SLOTS.map(([k, meal]) => { const r = RB[d[k]]; return `<button class="slot ${r ? '' : 'vacant'}" data-action="pick-slot" data-ws="${ws}" data-di="${i}" data-slot="${k}" data-key="${k}"><span class="th">${r ? pic(r.id) : ic('plus')}</span><span style="min-width:0"><span class="k">${MEALS[meal]}</span><span class="v ${r ? '' : 'empty'}">${r ? esc(r.title) : 'Odaberi jelo'}</span></span><span class="kc">${r ? fmt(r.nut[p].kcal) : ''}</span></button>`; }).join('');
    const flags = `<div class="dayflags"><button class="chip ${d.montaza ? 'on' : ''}" data-action="toggle-montaza" data-ws="${ws}" data-di="${i}" aria-pressed="${!!d.montaza}">${d.montaza ? '✓ montaža · hladni ručak' : 'Montaža?'}</button>${s.trainingDays.T.includes(i) ? `<span class="chip tag">trening ${esc(pname('T'))}</span>` : ''}${s.trainingDays.S.includes(i) ? `<span class="chip tag">trening ${esc(pname('S'))}</span>` : ''}</div>`;
    return `<article class="daycard ${date === td ? 'today' : ''}" style="--d:${i}" data-key="${date}"><div class="dh"><h3>${DAYS_LONG[i]} <small>${fmtDate(date)}${date === td ? ' · danas' : ''}</small></h3><span class="kc">${kcal ? fmt(kcal) + ' kcal' : ''}</span></div><div class="slots">${slots}</div>${flags}</article>`;

  <section class="days ${state.fresh ? 'fresh' : ''}">${days}</section>
  <section class="card"><details class="more" id="plan-rules" style="border:0;padding:0"><summary>Kako slažem prijedlog ${ic('down', '')}</summary><div class="rules">

  patch(rootEl, timers.map(t => { const left = Math.max(0, (t.end - Date.now()) / 1000); const frac = t.done ? 0 : left / t.total;
    return `<div class="timer ${t.done ? 'done' : ''}" data-key="${t.key}"><svg class="tr" viewBox="0 0 34 34" aria-hidden="true"><circle class="t0" cx="17" cy="17" r="14" fill="none" stroke-width="3.5"/><circle class="t1" cx="17" cy="17" r="14" fill="none" stroke-width="3.5" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}" transform="rotate(-90 17 17)"/></svg><div><div class="tm">${t.done ? 'Gotovo' : mmss(t)}</div><div class="lb">${esc(t.label)}</div></div><button data-action="timer-cancel" data-key="${t.key}" aria-label="Ukloni mjerač">${ic('x', '')}</button></div>`; }).join(''));
  document.querySelectorAll('.tchip[data-tkey]').forEach(b => { const t = timers.find(x => x.key === b.dataset.tkey && !x.done); b.classList.toggle('run', !!t); const sp = b.querySelector('span'); if (sp) sp.textContent = t ? mmss(t) : b.dataset.text; });
}

/* ===================== Akcije ===================== */
function setSlot(ws, di, slot, id) { const plan = clone(getPlan(ws)); plan.week = ws; plan.days[di][slot] = id || null; saveDoc('plans/' + ws, plan); }
function updateLog(date, p, patch) { const log = clone(getLog(date)); log[p] = Object.assign(log[p] || {}, patch); saveLog(log); }
function freshPlan() { state.fresh = true; setTimeout(() => { state.fresh = false; }, 900); }
const ACTIONS = {
  nav(t) { const v = t.dataset.v; if (v === state.view && !state.recipe) { scrollTop(); return; } go(() => { state.view = v; state.recipe = null; location.hash = v; }); },
  person(t) { state.person = t.dataset.p; LS.set('zns:person', state.person); render(); },
  date(t) { state.date = isoDate(addDays(parseDate(state.date), +t.dataset.d)); render(); },
  'set-date'(t) { state.date = t.dataset.d; buzz(6); render(); },
  'date-today'() { state.date = today(); render(); },
  week(t) { state.weekStart = isoDate(addDays(parseDate(state.weekStart), 7 * +t.dataset.d)); render(); },
  'week-today'() { state.weekStart = isoDate(mondayOf(new Date())); render(); },
  'goto-plan'(t) { go(() => { state.weekStart = t.dataset.ws; state.view = 'plan'; state.recipe = null; location.hash = 'plan'; }); },
  'goto-shop'(t) { go(() => { state.weekStart = t.dataset.ws; state.view = 'kupovina'; state.recipe = null; location.hash = 'kupovina'; }); },
  jump(t) {
    const el = document.getElementById(t.dataset.t); if (!el) return;
    if (t.dataset.t.startsWith('sec-')) { state.sec = t.dataset.t; document.querySelectorAll('.subnav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.t === state.sec))); }
    if (el.scrollIntoView) el.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'start' });
  },
  'open-recipe'(t) {
    const id = t.dataset.id; if (!state.recipe) { state.from = state.view; state.listScroll = scroller().scrollTop; }
    nameDish(t.querySelector('img') || (t.closest('.mcard, .rcard') || t).querySelector('img'));
    go(() => { state.recipe = id; state.view = 'recepti'; state.batch = false; state.sec = 'sec-porcije'; location.hash = 'recepti'; });
  },
  back() {
    const id = state.recipe, from = VIEWS.includes(state.from) ? state.from : 'recepti'; nameDish(document.querySelector('.dhero img'));
    go(() => { state.recipe = null; state.view = from; location.hash = from; }, { y: state.listScroll, after: () => nameDish(document.querySelector(`[data-action="open-recipe"][data-id="${id}"] img`)) });
  },
  rmeal(t) { state.rmeal = t.dataset.m; state.rtags.clear(); render(); },
  rtag(t) { const k = t.dataset.t; if (state.rtags.has(k)) state.rtags.delete(k); else state.rtags.add(k); render(); },
  'clear-filters'() { state.rtags.clear(); state.rq = ''; render(); },
  'toggle-batch'() { state.batch = !state.batch; render(); },
  'toggle-only-eaten'() { state.onlyEaten = !state.onlyEaten; render(); },
  'only-eaten'(t) { state.onlyEaten = t.dataset.v === '1'; render(); },
  'toggle-meal'(t) { const p = state.person, lp = getLog(state.date)[p] || {}; const meals = Object.assign({}, lp.meals || {}); meals[t.dataset.slot] = !meals[t.dataset.slot]; buzz(); updateLog(state.date, p, { meals }); if (meals[t.dataset.slot]) toast('Označeno kao pojedeno.'); },
  'toggle-snack'(t) { const p = state.person, lp = getLog(state.date)[p] || {}; const sn = (lp.snacks || []).slice(); const i = sn.indexOf(t.dataset.id); if (i >= 0) sn.splice(i, 1); else sn.push(t.dataset.id); buzz(); updateLog(state.date, p, { snacks: sn }); },
  'toggle-training'(t) { const on = t.getAttribute('aria-pressed') !== 'true'; t.setAttribute('aria-pressed', String(on)); buzz(); updateLog(state.date, state.person, { training: on }); },
  'toggle-ing'(t) { const k = t.dataset.k; if (state.got.has(k)) state.got.delete(k); else { state.got.add(k); buzz(6); } render(); },
  'suggest-slot'(t) { const r = suggestToday(t.dataset.slot); if (!r) return; const d = parseDate(state.date); const ws = isoDate(mondayOf(d)); setSlot(ws, dayIdx(d), t.dataset.slot, r.id); toast('Prijedlog: ' + r.title); },
  'pick-slot'(t) { state.rsearch = ''; state.modal = { type: 'pick', ws: t.dataset.ws, di: +t.dataset.di, slot: t.dataset.slot }; watch('plans/' + t.dataset.ws); renderModal(); },
  'pick-random'(t) {
    const ws = t.dataset.ws, di = +t.dataset.di, slot = t.dataset.slot, meal = SLOTS.find(([k]) => k === slot)[1];
    const used = new Set(getPlan(ws).days.flatMap(d => SLOTS.map(([k]) => d[k]))); const pool = RECIPES.filter(r => r.meal === meal && !used.has(r.id));
    const r = (pool.length ? pool : RECIPES.filter(x => x.meal === meal))[Math.floor(Math.random() * (pool.length || 10))]; if (!r) return;
    setSlot(ws, di, slot, r.id); closeModal(); toast(`${DAYS_LONG[di]}: ${r.title}`);
  },
  'set-slot'(t) { setSlot(t.dataset.ws, +t.dataset.di, t.dataset.slot, t.dataset.id); closeModal(); if (t.dataset.id) toast('Dodano u plan: ' + DAYS_LONG[+t.dataset.di]); },
  'toggle-montaza'(t) { const plan = clone(getPlan(t.dataset.ws)); plan.week = t.dataset.ws; plan.days[+t.dataset.di].montaza = !plan.days[+t.dataset.di].montaza; saveDoc('plans/' + t.dataset.ws, plan); },
  async 'suggest-week'() { const ws = state.weekStart; const has = getPlan(ws).days.some(d => d.b || d.l || d.v); const doIt = async () => { const counts = await usageCounts(ws); freshPlan(); saveDoc('plans/' + ws, buildWeek(getPlan(ws), counts, false)); toast('Tjedan je složen. Dodirni obrok da ga zamijeniš.', 'spark'); }; if (has) confirmModal('Zamijeniti postojeći plan?', 'Svi obroci ovog tjedna bit će zamijenjeni novim prijedlogom. Oznake montaže ostaju.', 'Zamijeni', doIt); else doIt(); },
  async 'suggest-week-here'() { const ws = isoDate(mondayOf(parseDate(state.date))); const counts = await usageCounts(ws); saveDoc('plans/' + ws, buildWeek(getPlan(ws), counts, true)); toast('Tjedan je složen.', 'spark'); },
  async 'suggest-week-fill'() { const ws = state.weekStart; const counts = await usageCounts(ws); freshPlan(); saveDoc('plans/' + ws, buildWeek(getPlan(ws), counts, true)); toast('Prazna mjesta su popunjena.', 'spark'); },
  'clear-week'() { const ws = state.weekStart; confirmModal('Očistiti plan?', 'Uklanja sve obroke ovog tjedna.', 'Očisti', () => saveDoc('plans/' + ws, emptyPlan(ws))); },
  'confirm-yes'() { const fn = confirmFn; confirmFn = null; closeModal(); if (fn) fn(); },
  'close-modal'() { closeModal(); },
  'close-modal-bg'(t, e) { if (e.target === t) closeModal(); },
  'add-to-plan'(t) { state.modal = { type: 'addplan', id: t.dataset.id, ws: state.weekStart }; renderModal(); },
  'addplan-week'(t) { state.modal.ws = isoDate(addDays(parseDate(state.modal.ws || state.weekStart), 7 * +t.dataset.d)); watch('plans/' + state.modal.ws); renderModal(); },
  'toggle-shop'(t) { const ws = state.weekStart; const doc = clone(state.docs['shopping/' + ws] || { checked: {} }); doc.checked = doc.checked || {}; if (doc.checked[t.dataset.id]) delete doc.checked[t.dataset.id]; else { doc.checked[t.dataset.id] = true; buzz(); } saveDoc('shopping/' + ws, doc); },
  'hide-bought'() { state.hideBought = !state.hideBought; render(); },
  'clear-shop'() { saveDoc('shopping/' + state.weekStart, { checked: {} }); },
  'copy-shop'() { const tot = weekShopping(state.weekStart); const byCat = {}; Object.entries(tot).forEach(([iid, g]) => { (byCat[ING[iid].cat] = byCat[ING[iid].cat] || []).push(`- ${ING[iid].name}: ${fmtQty(iid, g)}`); }); copyText(`Popis za kupovinu · ${weekLabel(state.weekStart)}\n\n` + Object.entries(byCat).map(([c, rows]) => `${CATS[c]}\n${rows.sort().join('\n')}`).join('\n\n')); },
  'copy-prompt'(t) { copyText(RB[t.dataset.id].img); },
  'del-entry'(t) { const date = t.dataset.date; confirmModal('Obrisati unos?', `${fmtDateLong(date)} · ${pname(state.person)}`, 'Obriši', () => { const log = clone(getLog(date)); delete log[state.person]; const other = state.person === 'T' ? 'S' : 'T'; if (log[other] && Object.keys(log[other]).length) saveLog(log); else deleteLog(date); }); },
  export() { copyText(JSON.stringify(exportData(), null, 1)); },
  'import-open'() { state.modal = { type: 'import', id: 'import' }; renderModal(); },
  'import-apply'() { const ta = document.getElementById('import-text'); importData(ta ? ta.value : ''); },
  'install'() { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.then(c => { if (c && c.outcome === 'accepted') toast('Za naš stol je na početnom zaslonu.'); installEvt = null; render(); }).catch(() => { }); },
  'install-hide'() { LS.set('zns:installTip', 'off'); render(); },
  cook(t) { openCook(t.dataset.id); },
  'cook-close'() { closeCook(); },
  'cook-next'() { cookStep(1); },
  'cook-prev'() { cookStep(-1); },
  'cook-ings'() { if (state.cook) { state.cook.ings = true; renderCook(); } },
  'cook-eaten'(t) { const p = state.person, td = today(), lp = getLog(td)[p] || {}; const meals = Object.assign({}, lp.meals || {}); meals[t.dataset.slot] = true; updateLog(td, p, { meals }); toast('Označeno kao pojedeno. Dobar tek!'); },
  timer(t) { startTimer(t.dataset.tkey, +t.dataset.sec, t.dataset.label); },
  'timer-cancel'(t) { const i = timers.findIndex(x => x.key === t.dataset.key); if (i >= 0) timers.splice(i, 1); paintTimers(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return; if (t.tagName === 'INPUT' || t.tagName === 'FORM') return;
  if (t.closest('#sheet-ghost')) return;
  const fn = ACTIONS[t.dataset.action]; if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'rsearch') { state.rsearch = e.target.value; renderModal(); }
  else if (e.target.id === 'rq') { state.rq = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (state.cook) { if (e.key === 'ArrowRight') { e.preventDefault(); cookStep(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); cookStep(-1); } else if (e.key === 'Escape') closeCook(); return; }
  if (state.modal && e.key === 'Escape') closeModal();
});
/* potezanje: lijevo/desno u načinu kuhanja, prema dolje za zatvaranje ploče */
let drag = null;
document.addEventListener('pointerdown', e => {
  const cb = e.target.closest('.cook-body'); const sh = e.target.closest('.sheet');
  if (cb) drag = { kind: 'cook', x: e.clientX, y: e.clientY };
  else if (sh && (e.target.closest('[data-drag]') || e.target.closest('.sh')) && !e.target.closest('button,input')) drag = { kind: 'sheet', y: e.clientY, el: sh, dy: 0 };
});
document.addEventListener('pointermove', e => { if (drag && drag.kind === 'sheet') { drag.dy = Math.max(0, e.clientY - drag.y); drag.el.style.transform = `translateY(${drag.dy}px)`; drag.el.style.transition = 'none'; } });
document.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null;
  if (d.kind === 'cook') { const dx = e.clientX - d.x, dy = e.clientY - d.y; if (Math.abs(dx) > 70 && Math.abs(dy) < 50) cookStep(dx < 0 ? 1 : -1); }
  else { d.el.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; if (d.dy > 90) closeModal(); else d.el.style.transform = ''; }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.type === 'checkbox' && t.name && t.name.startsWith('td-')) { const lab = t.closest('label'); if (lab) lab.classList.toggle('on', t.checked); return; }
  if (t.id === 'import-file' && t.files && t.files[0]) { try { importData(await t.files[0].text()); } catch (err) { toast('Datoteku nije moguće pročitati.', 'info'); } return; }
  if (t.dataset.action === 'upload-image' && t.files && t.files[0]) {
    if (!state.assets) return toast('Učitavanje slika nije dostupno za ovaj račun.', 'info');
    const rid = t.dataset.id; toast('Učitavam fotografiju…', 'image');
    try { const file = t.files[0]; const res = await state.assets.upload(file, file.type ? undefined : { type: 'image/jpeg' }); const im = Object.assign({}, state.docs['images/all'] || {}); im[rid] = res.id; saveDoc('images/all', im); toast('Fotografija je dodana.'); }
    catch (err) { console.warn(err); toast('Učitavanje nije uspjelo: ' + ((err && (err.message || err.code)) || 'greška'), 'info'); }
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.action === 'quick-log') {
    const w = parseFloat(String(fv(f, 'weight')).replace(',', '.')), wa = parseFloat(String(fv(f, 'waist')).replace(',', '.'));
    const training = document.getElementById('q-training').getAttribute('aria-pressed') === 'true';
    const patch = { training }; if (!isNaN(w)) patch.weight = Math.round(w * 10) / 10; if (!isNaN(wa)) patch.waist = Math.round(wa * 10) / 10;
    updateLog(state.date, state.person, patch); toast('Spremljeno u dnevnik.');
  } else if (f.dataset.action === 'log-entry') {
    const date = fv(f, 'date') || today(); const w = parseFloat(String(fv(f, 'weight')).replace(',', '.')), wa = parseFloat(String(fv(f, 'waist')).replace(',', '.'));
    const patch = {}; if (!isNaN(w)) patch.weight = Math.round(w * 10) / 10; if (!isNaN(wa)) patch.waist = Math.round(wa * 10) / 10; if (fv(f, 'training')) patch.training = true;
    if (!Object.keys(patch).length) return toast('Unesi težinu, struk ili trening.', 'info');
    updateLog(date, state.person, patch); ['le-weight', 'le-waist'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; }); toast('Spremljeno: ' + fmtDateLong(date));
  } else if (f.dataset.action === 'save-settings') {
    const s = settings(); const fd = new FormData(f); const num = (k, d) => { const v = parseFloat(String(fd.get(k) || '').replace(',', '.')); return isNaN(v) ? d : v; };
    for (const p of ['T', 'S']) { s.names[p] = (fd.get('name-' + p) || s.names[p]).toString().trim() || s.names[p]; s.goals[p] = fd.get('goal-' + p) || s.goals[p]; s.targets[p] = { kcal: num('kcal-' + p, s.targets[p].kcal), p: num('p-' + p, s.targets[p].p), c: num('c-' + p, s.targets[p].c), f: num('f-' + p, s.targets[p].f) }; s.trainingDays[p] = fd.getAll('td-' + p).map(Number); }
    s.names.K = (fd.get('name-K') || s.names.K).toString().trim() || s.names.K; s.fishPerWeek = num('fish', s.fishPerWeek);
    saveDoc('settings/main', s); toast('Postavke su spremljene.');
  }
});
window.addEventListener('hashchange', () => { const before = state.view; applyHash(); if (state.view !== before) state.recipe = null; render(); });
let rsz = null; window.addEventListener('resize', () => { if (state.view !== 'napredak') return; clearTimeout(rsz); rsz = setTimeout(render, 150); });
let spy = 0;
window.addEventListener('scroll', () => {
  if (spy) return; spy = requestAnimationFrame(() => {
    spy = 0; const top = document.getElementById('top'); if (top) top.classList.toggle('scrolled', scroller().scrollTop > 4);
    if (state.view === 'recepti' && state.recipe) {
      let cur = 'sec-porcije'; ['sec-porcije', 'sec-sastojci', 'sec-priprema', 'sec-nutrijenti'].forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 160) cur = id; });
      if (cur !== state.sec) { state.sec = cur; document.querySelectorAll('.subnav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.t === cur))); }
    }
  });
}, { passive: true });
function applyHash() { const h = location.hash.replace('#', ''); if (VIEWS.includes(h)) state.view = h; }

/* ===================== Pokretanje ===================== */
async function boot() {
  webBoot(); applyHash(); ensureWatches(); render();
  try {
    const cl = WEB ? null : window.claude;
    if (cl && typeof cl.use === 'function') {
      const [db, user, assets] = await Promise.all([cl.use('db'), cl.use('user'), cl.use('assets')]);
      state.user = user; state.assets = assets;
      if (db) {
        let can = null; try { can = user ? await user.can('data.write') : null; } catch (e) { can = null; }
        if (can === false) { state.mode = 'local'; state.writable = false; }
        else { state.db = db; state.mode = 'db'; state.writable = can; resetSubs(); state.docs = {}; state.logs = {}; }
      }
    }
  } catch (e) { console.warn('capabilities', e); }
  state.dbReady = true; ensureWatches(); render();
}
boot();

</script>
